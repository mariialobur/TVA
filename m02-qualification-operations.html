<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M02 — Qualification des opérations TVA · Formation de spécialiste TVA suisse</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>html,body,#module{width:100%;height:100%;margin:0;border:0;overflow:hidden;background:#F8F5EE}#module{display:block}</style></head>
<body><iframe id="module" src="m02-qualification-operations-base.html" title="M02 — Qualification des opérations TVA" allow="clipboard-write"></iframe>
<script>window.COURSE_GATE_CONFIG={module:'M02',src:'m02-qualification-operations-base.html',next:'m03-decomptes-methodes-tva.html',sections:['theory','legis','cases','errors','quiz','memo','vocab','cheat'],storagePrefixes:['tva_m02']};</script>
<script src="course-current-law-2026.js"></script><script src="course-legacy-gate.js"></script><script src="course-public-ui.js?v=20260912-0030"></script>
<script>
(()=>{
  const frame=document.getElementById('module');
  function repairM02(){
    try{
      const d=frame.contentDocument,w=frame.contentWindow;
      if(!d?.body||!w||d.documentElement.dataset.m02HierarchyFixed==='1')return;
      const content=d.querySelector('#main > .content')||d.querySelector('.content');
      const cases=d.getElementById('sec-cases');
      if(!content||!cases||typeof w.goto!=='function')return;

      /* Root cause repair: the source misses one closing </div> after the last
         cases-level, so all following sections become children of sec-cases.
         Move only the five affected top-level sections back beside sec-cases. */
      let anchor=cases;
      ['sec-errors','sec-quiz','sec-memo','sec-vocab','sec-cheat'].forEach(id=>{
        const el=d.getElementById(id);
        if(!el)return;
        if(el.parentElement!==content){anchor.insertAdjacentElement('afterend',el)}
        anchor=el;
      });

      /* M02 also contains two generations of flashcard CSS using the same
         .fc-front/.fc-back names. Scope the correction to the native memo card. */
      let style=d.getElementById('m02-native-memo-css-fix');
      if(!style){
        style=d.createElement('style');
        style.id='m02-native-memo-css-fix';
        style.textContent=`
          #sec-memo #fc-card{position:relative!important;overflow:visible!important;transform:none!important;perspective:none!important;background:#fff!important;}
          #sec-memo #fc-card>.fc-front,
          #sec-memo #fc-card>.fc-back{
            position:static!important;inset:auto!important;width:auto!important;height:auto!important;min-height:0!important;
            transform:none!important;backface-visibility:visible!important;-webkit-backface-visibility:visible!important;
            background:transparent!important;border:0!important;border-radius:0!important;padding:0!important;
            align-items:stretch!important;justify-content:flex-start!important;text-align:left!important;
          }
        `;
        d.head.appendChild(style);
      }

      d.documentElement.dataset.m02HierarchyFixed='1';

      /* Re-apply the section selected by the module itself. This also repairs
         already-saved sessions where the selected child was hidden by sec-cases. */
      let sec=d.querySelector('.nav-item.active[data-section]')?.getAttribute('data-section');
      if(!sec){try{sec=JSON.parse(w.localStorage.getItem('tva_m02_v4_7')||'{}').section}catch(e){}}
      if(!['theory','legis','cases','errors','quiz','memo','vocab','cheat'].includes(sec))sec='theory';
      w.goto(sec);
    }catch(e){console.error('M02 structural repair failed',e)}
  }
  frame.addEventListener('load',()=>setTimeout(repairM02,0));
  setTimeout(repairM02,250);
})();
</script></body></html>
