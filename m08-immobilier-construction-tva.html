<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M08 — Immobilier & construction</title><style>html,body,#module{width:100%;height:100%;margin:0;border:0;overflow:hidden;background:#F8F5EE}</style></head><body><iframe id="module" src="m08-immobilier-construction-tva-base.html" title="M08 — Immobilier & construction"></iframe><script>const f=document.getElementById('module');f.addEventListener('load',()=>{const d=f.contentDocument;if(!d)return;d.querySelectorAll('.vocab-card').forEach(c=>{const n=c.querySelector('.vfr'),def=c.querySelector('.vdef'),art=c.querySelector('.vart');if(!n||!def)return;const k=n.textContent.trim();if(k==='Option d’imposition immobilière'||k==="Option d'imposition immobilière"){def.textContent='Droit de soumettre volontairement une opération immobilière exclue à la TVA lorsque l’art. 22 le permet. Vérifier l’usage du bien, les exclusions à l’option et la modalité/timing d’exercice ; il n’existe pas une irrévocabilité générale « pour la durée du contrat ».';if(art)art.textContent='art. 22 LTVA · art. 39 OTVA · pratique AFC Immobilier'}if(k==='Immeuble mixte'){def.textContent='Immeuble affecté à des usages donnant et ne donnant pas droit au DIP. Procéder d’abord à l’affectation directe des coûts, puis appliquer une clé objective uniquement aux vrais coûts communs.';if(art)art.textContent='art. 30 LTVA · pratique AFC'}if(k==='Clé de répartition DIP'){def.textContent='Méthode objective pour les coûts réellement communs après affectation directe. La clé doit refléter l’utilisation effective ; surface, recettes ou autre critère ne sont pas des clés légales universelles.';if(art)art.textContent='art. 30 LTVA · méthode objective documentée'}if(k==="Changement d'affectation"){def.textContent='Passage d’un usage donnant droit au DIP à un usage n’y donnant plus droit, ou inversement. Analyser correction/dégrèvement sur la valeur résiduelle ; pour l’immobilier, la logique de 1/20 par année s’applique selon les conditions légales.';if(art)art.textContent='art. 31–32 LTVA · valeur résiduelle'}if(k==="Imposition à l'acquisition (travaux)"){def.textContent='Pour un entrepreneur étranger intervenant sur un immeuble suisse, qualifier d’abord la livraison/prestation et le lieu, puis vérifier son éventuelle obligation d’inscription en Suisse, l’importateur et la TVA à l’importation. L’impôt sur les acquisitions n’intervient que si les conditions de l’art. 45 sont effectivement remplies.';if(art)art.textContent='art. 8 · 10 · 45 · 50 ss LTVA'}});});</script></body></html>
