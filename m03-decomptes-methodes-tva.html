<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M03 — Décomptes TVA & Méthodes</title><style>html,body,#module{width:100%;height:100%;margin:0;border:0;overflow:hidden;background:#F8F5EE}</style></head><body><iframe id="module" src="m03-decomptes-methodes-tva-base.html" title="M03 — Décomptes TVA & Méthodes"></iframe><script>const f=document.getElementById('module');f.addEventListener('load',()=>{const d=f.contentDocument;if(!d)return;d.querySelectorAll('li,p').forEach(el=>{const t=el.textContent.trim();if(t==='Engagement minimum 1 an'){el.textContent='Durée et changement : appliquer l’art. 37 al. 4 LTVA, l’OTVA et la pratique AFC actuelles ; ne pas mémoriser « 1 an » comme règle universelle.'}if(t.includes('Dépassement de seuil')&&t.includes('notification 30 jours')&&t.includes('correction d’entrée stocks')){el.textContent='Dépassement des limites : vérifier les règles actuelles de sortie de la méthode TDFN selon la situation et la période concernée. Depuis 2025, un changement de méthode implique des corrections sur la valeur résiduelle des biens et prestations ; ne pas appliquer une formule automatique « exercice suivant + 30 jours + stocks ».'}});d.querySelectorAll('a[href]').forEach(a=>{const h=a.getAttribute('href')||'';if(h&&!h.startsWith('#')&&!/^https?:/i.test(h)&&!h.startsWith('javascript:'))a.target='_top'});});</script></body></html>
