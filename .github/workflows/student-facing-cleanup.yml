name: Student-facing cleanup
on:
  push:
    paths:
      - '.github/workflows/student-facing-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply student-facing cleanup
        run: python3 tools/student-facing-cleanup.py
      - name: Commit cleaned public copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add m09-secteurs-sensibles-tva.html m12-jurisprudence-lab-tva.html m13-communication-fiscale-cabinet.html m14-examen-blanc-synthese-finale.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Polish student-facing language in M09-M14"
            git push
          fi
