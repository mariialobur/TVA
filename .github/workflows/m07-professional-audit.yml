name: M07 professional audit

on:
  push:
    paths:
      - '.m07-professional-trigger'

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply M07 professional patch
        run: python3 tools/m07_professional_patch.py
      - name: Validate M07
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          t=Path('m07-holdings-groupes-tva.html').read_text(encoding='utf-8')
          forbidden=[
            'ATAF A-1558/2014','A-1558/2014','ATAF A-6362/2014','A-6362/2014',
            'ATAF A-2454/2020','A-2454/2020','ATF 138 II 251',
            'dividendes + intérêts',
            'Dénominateur uniquement (réduit %)',
            'seule une décision formelle AFC est contraignante',
            '4 critères cumulatifs',
            'Solidairement responsable de toutes les obligations fiscales du groupe',
            'v4.3 — final 10/10',
          ]
          for s in forbidden:
              assert s not in t, 'forbidden: '+s
          required=[
            'art. 10 al. 1ter',
            'art. 33 al. 1',
            'art. 24 al. 2',
            'art. 17a OTVA',
            'art. 22 OTVA',
            'Formulaire 764',
            '17.11.2025',
            'notification d’estimation',
            'paiement sans réserve',
            "d.M07='done'",
            'm08-immobilier-construction-tva.html',
            'Continuer avec M08',
            'Conception :',
          ]
          for s in required:
              assert s in t, 'required: '+s
          assert t.count('<h1')==1, 'expected one H1'
          assert t.count('id="m07-complete"')==1
          case_steps=len(re.findall(r'class="step" id="c\d+s\d+"',t))
          print('case steps',case_steps)
          assert case_steps==16
          m=re.search(r'const QS=(\[.*?\]);\nconst QUIZ=',t,re.S); assert m
          qs=json.loads(m.group(1)); assert len(qs)==35, len(qs)
          m2=re.search(r'const CARDS=(\[.*?\]);\nconst FC=',t,re.S); assert m2
          cards=json.loads(m2.group(1)); assert len(cards)==30, len(cards)
          scripts=re.findall(r'<script>(.*?)</script>',t,re.S); assert scripts
          Path('/tmp/m07.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('M07 bytes',len(t.encode()),'QCM',len(qs),'cards',len(cards),'h1',t.count('<h1'))
          PY
          node --check /tmp/m07.js
      - name: Commit M07
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add m07-holdings-groupes-tva.html
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Finalize M07 holdings and VAT groups professional audit"
          git push
