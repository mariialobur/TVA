name: Final QA M02

on:
  push:
    paths:
      - .m02-final-qa-trigger

permissions:
  contents: write

jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run final current-law patch
        run: |
          git show c7960af01ebc22485993c0acad4f5f5f21140f9b:.github/workflows/m02-final-qa.yml > /tmp/m02-old-workflow.yml
          python3 - <<'PY'
          from pathlib import Path
          src = Path('/tmp/m02-old-workflow.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(src) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(src)) if src[i].strip() == 'PY')
          code = []
          for line in src[start:end]:
              code.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/m02-final-patch.py').write_text('\n'.join(code) + '\n', encoding='utf-8')
          print('extracted patch lines:', len(code))
          PY
          python3 /tmp/m02-final-patch.py

      - name: Validate M02
        run: |
          ! grep -q "A-6218/2011" m02-qualification-operations.html
          ! grep -q "CHF 720'000 × 8,1%" m02-qualification-operations.html
          ! grep -q "CHF 8'000-12'000" m02-qualification-operations.html
          ! grep -q 'prestations en réalité "exonérées art. 23"' m02-qualification-operations.html
          ! grep -q "Médecine esthétique = imposable 8,1%" m02-qualification-operations.html
          ! grep -q "prorata objectif selon CA imposable / CA total" m02-qualification-operations.html
          ! grep -q "art. 10 al. 1 LTVA" m02-qualification-operations.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          t = Path('m02-qualification-operations.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', t, re.S)
          Path('/tmp/m02-final.js').write_text('\n'.join(scripts), encoding='utf-8')
          print('inline scripts:', len(scripts))
          PY
          node --check /tmp/m02-final.js

      - name: Commit final M02 QA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add m02-qualification-operations.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Finalize M02 against current AFC and OTVA practice"
          git push
