name: Professional audit M04

on:
  push:
    paths:
      - '.m04-professional-audit-trigger'

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply M04 professional audit
        run: |
          cat tools/m04parts/part*.b64 | base64 -d | gzip -d > /tmp/m04_patch.py
          python3 /tmp/m04_patch.py
      - name: Validate M04
        run: |
          ! grep -q "Amende CHF 800 à 10'000" m04-tva-comptabilite-suisse.html
          ! grep -q "33% à 300%" m04-tva-comptabilite-suisse.html
          ! grep -q "Escroquerie fiscale : usage de titres faux" m04-tva-comptabilite-suisse.html
          ! grep -q "Formulaire 100" m04-tva-comptabilite-suisse.html
          ! grep -q "Formulaire 550_03" m04-tva-comptabilite-suisse.html
          ! grep -q "structure standard est universellement adoptée" m04-tva-comptabilite-suisse.html
          ! grep -q "Google Drive standard" m04-tva-comptabilite-suisse.html
          ! grep -q "plan maximum 24 mois" m04-tva-comptabilite-suisse.html
          ! grep -q "art. 27 LTVA pour récupération TVA sur créances irrécouvrables" m04-tva-comptabilite-suisse.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('m04-tva-comptabilite-suisse.html').read_text(encoding='utf-8')
          assert 'v5.0 — Comptabilité &amp; traçabilité TVA' in t
          assert 'Mariia Lobur' in t
          assert 'Décompte TVA pro' in t
          assert 'période de décompte dans laquelle tombe le <strong>180e jour</strong>' in t
          assert 'repère pratique de <strong>240 jours</strong>' in t or 'repère pratique AFC de 240 jours' in t
          assert 'art. 41 LTVA' in t
          assert 'art. 79 LTVA' in t
          assert 'm05-deduction-impot-prealable-dip.html' in t
          assert 'Le ch. 383 (impôt sur les acquisitions) et les corrections de DIP ne s’ajoutent pas au chiffre d’affaires comptable.' in t
          assert "let state={schemaVersion:'v5_0'" in t
          q=len(re.findall(r"id:'m04-q",t))
          cases=len(re.findall(r'class="case-step"',t))
          print('QCM',q,'case steps',cases,'bytes',len(t.encode()))
          assert q==30
          assert cases>=30
          scripts=re.findall(r'<script>(.*?)</script>',t,re.S)
          assert scripts
          Path('/tmp/m04.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/m04.js
      - name: Commit M04
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add m04-tva-comptabilite-suisse.html
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Audit M04 accounting traceability and VAT practice"
          git push
