name: M04 polish audit

on:
  push:
    paths:
      - '.m04-polish-trigger'

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply M04 polish patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('tools/m04_polish_patch.py').read_text(encoding='utf-8')
          src=src.replace("    'q07 account convention')", "    'q07 account convention',required=False)")
          exec(compile(src,'/tmp/m04_polish_patch.py','exec'))
          p=Path('m04-tva-comptabilite-suisse.html')
          t=p.read_text(encoding='utf-8')
          start="  { id:'m04-q07'"
          end="  { id:'m04-q08'"
          a=t.find(start); b=t.find(end,a)
          assert a>=0 and b>a
          q07=(
              "  { id:'m04-q07', diff:'easy', art:'plan comptable · convention M04',\n"
              "    q:'Dans la convention pédagogique de M04, quel compte suit le DIP déductible sur les achats courants ?',\n"
              "    opts:[\n"
              "      '1100 Débiteurs',\n"
              "      '1170 TVA déductible',\n"
              "      '2200 TVA collectée',\n"
              "      '4000 Achats'\n"
              "    ],\n"
              "    correct:1,\n"
              "    expl:'Dans la convention comptable de M04, le compte 1170 suit le DIP déductible et présente normalement un solde débiteur. Un sous-compte 1171 peut être utilisé pour les investissements afin d’améliorer la traçabilité, mais ce numéro n’est pas imposé par la LTVA.'\n"
              "  },\n"
          )
          t=t[:a]+q07+t[b:]
          bad="Le changement de mode exige une transition documentée. Pour la méthode effective, l'art. 106 OTVA règle le passage entre contre-prestations convenues et reçues; le professionnel identifie les débiteurs/créanciers ouverts et contrôle le premier décompte afin d'éviter doubles déclarations ou omissions. L'art. 40 règle ensuite les effets temporels du mode choisi."
          good="Le changement de mode exige une transition documentée. Pour la méthode effective, l’art. 106 OTVA règle le passage entre contre-prestations convenues et reçues; le professionnel identifie les débiteurs/créanciers ouverts et contrôle le premier décompte afin d’éviter doubles déclarations ou omissions. L’art. 40 règle ensuite les effets temporels du mode choisi."
          assert bad in t
          t=t.replace(bad,good)
          p.write_text(t,encoding='utf-8')
          PY
      - name: Validate polished M04
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('m04-tva-comptabilite-suisse.html').read_text(encoding='utf-8')
          forbidden=[
            'Principe de présentation fidèle (image fidèle)',
            'sans empêcher l\'image fidèle',
            'Le délai légal est de <strong>240 jours',
            'Art. 86 al. 2 LTVA + ATAF',
            'le compte 1171 est réservé aux investissements',
            'solde 2200 devrait être ≈',
            'concordance annuelle / décompte rectificatif art. 72</strong> dans les 240 jours',
            'Rapprochement annuel CA TVA déclaré vs CA comptable. concordance annuelle',
            "AWS, Adobe, Stripe US) génère une <strong>double écriture TVA</strong>",
          ]
          for s in forbidden:
              assert s not in t, 'forbidden: '+s
          required=[
            'art. 106 OTVA règle le passage entre contre-prestations convenues et reçues',
            'But de la présentation des comptes',
            'opinion fondée',
            'Le ch. 200 représente le total des contre-prestations avant les déductions',
            'période pendant laquelle tombe le 180e jour',
            'La loi n’impose pas un numéro de compte 1171',
            'L’art. 79 LTVA est la base de la fixation par voie d’estimation',
            'Convention de comptes utilisée dans M04',
            'Continuer avec M05',
            'Mariia Lobur',
          ]
          for s in required:
              assert s in t, 'missing: '+s
          q=len(re.findall(r"id:'m04-q",t)); cases=len(re.findall(r'class="case-step"',t))
          assert q==30, q
          assert cases==39, cases
          assert t.count('<h1')==1
          scripts=re.findall(r'<script>(.*?)</script>',t,re.S)
          assert scripts
          Path('/tmp/m04.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('POLISHED M04 bytes',len(t.encode()),'QCM',q,'case steps',cases,'H1',t.count('<h1'))
          PY
          node --check /tmp/m04.js
      - name: Broad residual scan
        run: |
          grep -nEi "image fidèle|240 jours|art\. 86 al\. 2|3 ans en effective|Google Drive|système d.archivage certifié|Stripe|1171|Formulaire 550_03|Q4 uniquement|présomption d.erreur ou de soustraction" m04-tva-comptabilite-suisse.html || true
      - name: Commit polished M04
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add m04-tva-comptabilite-suisse.html
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Polish M04 accounting and finalisation consistency"
          git push
