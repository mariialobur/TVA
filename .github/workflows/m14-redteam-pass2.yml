name: M14 red-team pass 2
on:
  push:
    paths:
      - '.github/workflows/m14-redteam-pass2.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply second-pass remediation
        run: node tools/m14-redteam-pass2.mjs
      - name: Commit second-pass remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add m14-q1.js m14-q2.js m14-q3.js m14-q4a.js m14-q4b.js
          git commit -m "Strengthen M14 distractors after red-team" || exit 0
          git push
