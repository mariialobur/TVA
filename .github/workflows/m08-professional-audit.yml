name: M08 professional audit

on:
  push:
    paths:
      - '.m08-professional-trigger'

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply M08 professional patch
        run: |
          python3 tools/m08_professional_patch.py
          python3 tools/m08_quiz_fix.py
          python3 tools/m08_final_quality.py
      - name: Validate M08
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('m08-immobilier-construction-tva.html').read_text(encoding='utf-8')
          forbidden=[
            'ATF 140 II 88','ATAF A-2454/2020','ATF 138 II 239','ATF 126 II 249','ATAF A-5106/2020',
            "L'AFC reçoit les avis des autorités du registre foncier pour chaque mutation immobilière",
            '3 critères cumulatifs','v4.3 — final 10/10 immobilier','dossier premium','Risque Noir',
            'TVA Sectorielle III (SaaS, e-commerce, Transport)',
            'TVA 8,1% sur coût de revient (MO + matériaux, sans marge)',
            'Cle prioritaire','Toutes les 25 cartes vues','informer AFC => correction affectation possible',
            'CHF 3\\'000 d\\'interets supplementaires','L\'acheteur exerce l\'option art. 22'
          ]
          for s in forbidden:
              assert s not in t, 'forbidden: '+s
          required=[
            '<h1 class="hero-h">TVA Immobilier &amp; Construction</h1>',
            'indication claire de la TVA sur la facture/quittance',
            "déclaration de l'imposition dans le décompte TVA",
            'Place de parc privée indépendante','Imposable de plein droit au taux normal',
            'art. 69 OTVA',"5% de la valeur d'assurance",'1/20 par année écoulée',
            'valeur du sol','Hiérarchie des sources',"impôt à l'importation",
            "d.M08='done'",'m09-secteurs-sensibles-tva.html','Continuer avec M09',
            'id="m08-complete"','Tableau de bord','M08-AUDIT-Q35',
            "c:0,e:'Art. 30 LTVA : commencer par l’affectation directe",
            'Toutes les 30 cartes vues !',
            "if(state.completed){",
            'Le promoteur, en tant que vendeur assujetti, exerce clairement l\'option art. 22'
          ]
          for s in required:
              assert s in t, 'required: '+s
          h1=t.count('<h1'); complete=t.count('id="m08-complete"')
          steps=len(re.findall(r'class="step" id="c\d+s\d+"',t))
          m=re.search(r'var\s+QS\s*=\s*(\[.*?\]);\s*var\s+QUIZ\s*=',t,re.S); assert m, 'QS block not found'
          qs=len(re.findall(r"\{a:'",m.group(1)))
          m2=re.search(r'var\s+CARDS\s*=\s*(\[.*?\]);\s*var\s+FC\s*=',t,re.S); assert m2, 'CARDS block not found'
          cards=len(re.findall(r"\{cat:'|\{\"cat\":",m2.group(1)))
          print('M08 bytes',len(t.encode()),'QCM',qs,'cards',cards,'case-steps',steps,'h1',h1,'complete',complete)
          assert h1==1, h1
          assert complete==1, complete
          assert steps==17, steps
          assert qs==35, qs
          assert cards==30, cards
          scripts=re.findall(r'<script>(.*?)</script>',t,re.S); assert scripts
          Path('/tmp/m08.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/m08.js
      - name: Commit M08
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add m08-immobilier-construction-tva.html
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Polish M08 real estate VAT quality"
          git push
