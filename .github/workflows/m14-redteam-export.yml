name: M14 red-team export
on:
  push:
    paths:
      - '.github/workflows/m14-redteam-export.yml'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Analyze M14 bank
        run: node tools/m14-redteam-export.mjs
      - name: Commit temporary red-team corpus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/m14-redteam-report.json tools/m14-redteam-corpus.json
          git commit -m "Export M14 red-team corpus" || exit 0
          git push
