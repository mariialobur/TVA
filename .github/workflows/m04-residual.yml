name: M04 residual audit

on:
  push:
    paths:
      - '.m04-residual-trigger'

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply residual M04 patch
        run: python3 tools/m04_residual_patch.py
      - name: Validate M04 residual audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('m04-tva-comptabilite-suisse.html')
          t=p.read_text(encoding='utf-8')
          forbidden=[
            "plan de paiement négocié (max 24 mois)",
            "Conformité AFC native",
            "Google Drive permet modification donc défaillant",
            "3 ans en effective avant retour à TDFN",
            "fixation par voie d’estimation par estimation",
            "Art. 86 al. 2 LTVA</strong> : si les éléments transmis",
            "Auto-imposition art. 45 LTVA : (96'000 + 24'000 + 6'000)",
            "Subvention / (Subvention + CA total)",
            "image fidèle (true and fair view) de la situation économique",
          ]
          for s in forbidden:
              assert s not in t, s
          required=[
            "v5.0 — Comptabilité &amp; traçabilité TVA",
            "art. 79 LTVA",
            "liberté des moyens de preuve",
            "La conformité dépend des mesures techniques/organisationnelles",
            "Affecter les dépenses directement quand c’est possible",
            "Qualifier chaque prestation : AWS/Notion",
            "TDFN → effective · pratique AFC 2025+",
            "Continuer avec M05",
            "Mariia Lobur",
          ]
          for s in required:
              assert s in t, s
          assert len(re.findall(r"id:'m04-q",t))==30
          assert len(re.findall(r'class="case-step"',t))>=30
          assert t.count('<h1')==1
          scripts=re.findall(r'<script>(.*?)</script>',t,re.S)
          assert scripts
          Path('/tmp/m04.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('M04 bytes',len(t.encode()),'QCM',len(re.findall(r"id:\'m04-q",t)),'case steps',len(re.findall(r'class="case-step"',t)))
          PY
          node --check /tmp/m04.js
      - name: Commit M04 residual audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add m04-tva-comptabilite-suisse.html
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Finalize M04 professional consistency audit"
          git push
