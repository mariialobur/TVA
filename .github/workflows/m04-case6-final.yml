name: M04 Case 6 final check

on:
  push:
    paths:
      - '.m04-case6-trigger'

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct M04 Case 6 and revenue mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('m04-tva-comptabilite-suisse.html')
          t=p.read_text(encoding='utf-8')
          changes=[]
          def rep(old,new,label):
              global t
              n=t.count(old)
              assert n>0, label
              t=t.replace(old,new)
              changes.append((label,n))
          rep('<tr><td class="acc-num">3200</td><td>Produits exonérés art. 23 (exports de biens)</td><td>ch. 220</td></tr>','<tr><td class="acc-num">3200</td><td>Exportations de biens exonérées art. 23</td><td>ch. 220</td></tr>\n<tr><td class="acc-num">3210</td><td>Prestations de services localisées à l’étranger (art. 8, selon le cas)</td><td>ch. 221</td></tr>','add foreign-services account convention')
          rep('<tr><td class="acc-num">3400</td><td>Subventions et dons hors champ</td><td>ch. 900/910 + éventuel ch. 420</td></tr>','<tr><td class="acc-num">3400</td><td>Subventions / contributions hors contre-prestation</td><td>ch. 900/910 + éventuelle réduction DIP ch. 420 selon art. 33</td></tr>\n<tr><td class="acc-num">3401</td><td>Dons hors contre-prestation</td><td>ch. 900/910; pas de réduction automatique du DIP</td></tr>','separate subsidies and donations')
          rep('<div class="case-subtitle">SaaS B2B Suisse + Exports UE · Zurich · Setup 2026 · 🟡 Risque moyen</div>','<div class="case-subtitle">SaaS B2B Suisse + prestations UE · Zurich · Setup 2026 · 🟡 Risque moyen</div>','case6 subtitle')
          rep('(2) <strong>SaaS B2B exports UE</strong> (Allemagne, France) — <strong>lieu de la prestation à l\'étranger (art. 8 al. 1 LTVA)</strong>, donc HORS CHAMP TVA suisse, déclaré au ch. 221 du décompte.','(2) <strong>SaaS B2B clients UE</strong> (Allemagne, France) — <strong>lieu de la prestation à l\'étranger (art. 8 al. 1 LTVA)</strong>, donc hors TVA suisse et repris au ch. 221 du décompte actuel.','case6 scenario')
          rep('B) Compte 3000 (Ventes SaaS Suisse 8,1%) + Compte 3200 (Ventes SaaS exports art. 23)','B) Compte 3000 (SaaS Suisse 8,1%) + compte distinct 3210 (prestations B2B UE localisées à l’étranger → ch. 221)','case6 q1 option')
          rep('<strong>Ventilation correcte</strong> : compte <strong>3000</strong> (Ventes SaaS Suisse — imposable 8,1% → ch. 303) + compte <strong>3200</strong> (Ventes SaaS B2B UE — lieu de prestation à l\'étranger → ch. 221). Le compte 3300 est réservé aux activités <strong>exclues</strong> art. 21 (médical, formation, immobilier). Les services SaaS <strong>B2B exportés</strong> ont leur lieu de prestation au siège du destinataire (<strong>art. 8 al. 1 LTVA</strong>) → opérations <strong>hors champ TVA suisse</strong>, mais <strong>DIP conservé</strong> (assimilées à imposable pour l\'IP). La ventilation comptable préfigure la ventilation décompte (ch. 303 vs ch. 221).','<strong>Ventilation correcte</strong> : compte <strong>3000</strong> (SaaS Suisse — imposable 8,1% → ch. 303) + un compte distinct, <strong>3210 dans la convention M04</strong>, pour les prestations B2B UE localisées chez le destinataire à l’étranger → ch. 221. Le compte 3200 reste réservé dans M04 aux exportations de biens art. 23 (ch. 220), et 3300 aux prestations exclues art. 21. Cette séparation évite de confondre <strong>lieu de prestation à l’étranger</strong> et <strong>exonération d’une exportation de biens</strong>.','case6 q1 explanation')
          rep('<div class="step-question"><span class="step-q-num">Q2</span>Quels codes TVA Bexio associer ?</div>','<div class="step-question"><span class="step-q-num">Q2</span>Quel principe de mapping TVA appliquer dans Bexio ?</div>','case6 q2 question')
          rep('B) Compte 3000 → code UN1 (8,1% imposable) · Compte 3200 → code ESP (exonéré art. 23, DIP conservé)','B) 3000 → code configuré vers le taux normal; 3210 → code configuré vers les prestations localisées à l’étranger / ch. 221, après vérification du libellé réel dans la version utilisée','case6 q2 option')
          old="Exemple pédagogique de codes TVA ERP : <strong>UN1</strong> = taux normal 8,1% imposable, <strong>UN2</strong> = taux réduit 2,6%, <strong>UN3</strong> = taux 3,8%, <strong>EXP</strong> = export art. 23 (ch. 220, DIP en principe conservé), <strong>HS</strong> = prestation localisée hors Suisse (ch. 221), <strong>EXC</strong> = exclu art. 21 non opté (ch. 230, DIP à corriger), <strong>SUB</strong> = subvention/don hors contre-prestation (ch. 900/910 + éventuel ch. 420). Le code TVA détermine où l'opération s'inscrira dans le décompte. <strong>Erreur fréquente</strong> : confondre ESP et EXC → DIP perdu à tort ou conservé à tort."
          new="Les <strong>noms de codes TVA dépendent du logiciel, de la version et du paramétrage</strong>. Le contrôle professionnel consiste à vérifier que le code du compte 3000 alimente bien le taux normal et que le code du compte 3210 alimente le ch. 221 pour une prestation localisée à l'étranger. Ne pas utiliser un code « export art. 23 » par analogie si l'opération relève en réalité de l'art. 8. Conserver une table de mapping versionnée entre code ERP, qualification TVA et rubrique du décompte."
          rep(old,new,'case6 q2 explanation')
          rep("Les <strong>exports art. 23</strong> sont <strong>exonérés</strong> mais <strong>conservent le DIP</strong>. Sur le plan IP, ils sont assimilés à l'activité imposable. Donc l’IP commun (loyer, IT, marketing) est déductible si les coûts sont affectés à des opérations ouvrant droit au DIP et si les preuves sont suffisantes — pas de correction art. 30/33 dans ce cas simple. C'est la différence cruciale avec les exclus art. 21 qui réduiraient le DIP par prorata. Cf. M05 pour le DIP en détail.","Les prestations B2B du cas qui sont <strong>localisées à l'étranger</strong> ne sont pas des exportations de biens art. 23. Le droit au DIP peut néanmoins être conservé pour des prestations fournies à l'étranger qui ouvriraient ce droit si elles étaient fournies en Suisse, sous les conditions de l'<strong>art. 29 LTVA</strong>. Dans ce cas simple, l'IP commun reste déductible si son affectation et les preuves sont suffisantes; M05 traite les situations mixtes et corrections.",'case6 q3 explanation')
          rep('📋 art. 28 al. 1 + 30 LTVA','📋 art. 28-30 LTVA · notamment art. 29 pour prestations à l’étranger','case6 q3 ref')
          p.write_text(t,encoding='utf-8')
          print('Case 6 corrections',changes)
          PY
      - name: Validate M04 final content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('m04-tva-comptabilite-suisse.html').read_text(encoding='utf-8')
          assert 'SaaS exports art. 23' not in t
          assert 'Compte 3200 → code ESP (exonéré art. 23' not in t
          assert 'Les <strong>exports art. 23</strong> sont <strong>exonérés</strong>' not in t
          assert '3210</td><td>Prestations de services localisées à l’étranger' in t
          assert '3401</td><td>Dons hors contre-prestation' in t
          assert 'lieu de prestation à l’étranger</strong> et <strong>exonération d’une exportation de biens' in t
          q=len(re.findall(r"id:'m04-q",t)); cases=len(re.findall(r'class="case-step"',t))
          assert q==30 and cases==39 and t.count('<h1')==1
          scripts=re.findall(r'<script>(.*?)</script>',t,re.S)
          Path('/tmp/m04.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('M04 FINAL',len(t.encode()),'bytes; QCM',q,'case steps',cases,'H1',t.count('<h1'))
          PY
          node --check /tmp/m04.js
          grep -nE "SaaS B2B exports|exports art\. 23|ESP \(exonéré art\. 23|SUB.*subvention/don" m04-tva-comptabilite-suisse.html || true
      - name: Commit M04 final correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add m04-tva-comptabilite-suisse.html
          git commit -m "Correct M04 foreign-service mapping"
          git push
