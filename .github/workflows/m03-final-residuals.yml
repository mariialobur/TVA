name: M03 final residuals

on:
  push:
    paths:
      - '.m03-final-residuals-trigger'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch residual inconsistencies
        run: python3 tools/m03_finalize_residuals.py
      - name: Validate M03
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('m03-decomptes-methodes-tva.html').read_text(encoding='utf-8')
          assert 'Art. 72 : période contenant le 180e jour' in t
          assert 'repère pratique AFC de 240 jours' in t
          assert 'Au moins une période fiscale complète' in t
          assert len(re.findall(r"id:'m03-q",t)) == 35
          scripts=re.findall(r'<script>(.*?)</script>',t,re.S)
          Path('/tmp/m03.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/m03.js
      - name: Commit M03
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add m03-decomptes-methodes-tva.html
          git commit -m "Fix final M03 concordance and duration wording"
          git push
