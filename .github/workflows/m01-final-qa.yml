name: Final QA M01

on:
  push:
    paths:
      - '.m01-final-qa-trigger'

permissions:
  contents: write

jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Final wording patch and syntax QA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('m01-introduction-tva-suisse.html')
          t = p.read_text(encoding='utf-8')

          t = t.replace(
            "Union douanière CH-Liechtenstein : LTVA applicable au Liechtenstein. Pas de TVA propre.",
            "Dans le cadre conventionnel Suisse–Liechtenstein, le Liechtenstein est intégré au territoire TVA commun pour l’application de la TVA. Pour une formalité administrative concrète au Liechtenstein, vérifier l’autorité et la pratique compétentes."
          )

          p.write_text(t, encoding='utf-8')

          # Extract inline JavaScript for Node syntax validation.
          scripts = re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', t, flags=re.S|re.I)
          Path('/tmp/m01-inline.js').write_text('\n\n'.join(scripts), encoding='utf-8')
          print('inline scripts:', len(scripts))
          PY

          node --check /tmp/m01-inline.js

          # Structural / content guards.
          grep -q "Objectifs de M01 — ce que vous devez savoir faire" m01-introduction-tva-suisse.html
          grep -q "Force des sources" m01-introduction-tva-suisse.html
          grep -q "Continuer avec M02" m01-introduction-tva-suisse.html
          grep -q "Mariia Lobur · LinkedIn" m01-introduction-tva-suisse.html
          grep -q "M01 v4.4" m01-introduction-tva-suisse.html
          ! grep -q "Engagement 3 ans" m01-introduction-tva-suisse.html
          ! grep -q "Carnet de bord voiture + journal des repas d'affaires obligatoires" m01-introduction-tva-suisse.html
          ! grep -q "Pas de TVA propre" m01-introduction-tva-suisse.html

      - name: Commit final wording patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add m01-introduction-tva-suisse.html
          if git diff --cached --quiet; then
            echo "No content patch needed; QA passed"
            exit 0
          fi
          git commit -m "Finalize M01 wording and syntax QA"
          git push
